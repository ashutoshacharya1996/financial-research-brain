name: Weekly Market Fetch

# Redesigned 2026-11-16: fetches broad-market, sector, macro, news and mutual-fund NAV data
# for the weekly /market-brief. The per-stock fetch (scripts/fetch_evidence.py) is no longer
# scheduled; run it manually if stock-level research is needed.

on:
  schedule:
    # 03:30 UTC = 09:00 IST every Sunday
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run market fetch
        run: python scripts/fetch_market.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 02_RAW_DOCUMENTS/_market/
          if git diff --cached --quiet; then
            echo "No new market data — nothing to commit"
          else
            git commit -m "chore: weekly market fetch $(date -u +%Y-%m-%d)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
